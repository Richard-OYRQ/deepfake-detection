    ## ⚠️ 判定准则（重要）
    - **单条软证据不成罪**：#1 边缘模糊、#3 皮肤平滑、#4 肤色差异、#7 毛发边缘、#11 清晰度波动、#12 面颈清晰度差异——这些单独或组合出现时，美颜滤镜+视频压缩完全可以解释，**不能作为判定伪造的依据**，应标"可疑"而非"异常"。
    - **硬证据才构成证据链**：#2 结构撕裂、#5 光影矛盾、#6 系统性唇形脱同步、#10 微表情肌肉脱节、#14 背景粘连。伪造判定需要：至少 2 条硬证据，或 1 条硬证据 + 明确的时空耦合软证据（如边界断层+该处色差割裂线同时出现）。
    - **物理不可能性证据（#15 遮挡破坏、#16 转动连续性）权重最高**：这两类现象在真实拍摄中物理上无法产生，美颜滤镜与视频压缩均无法解释。只要确认其中任一条为"异常"，即可**单独构成定罪的充分证据**，无需其他证据配合；标为"可疑"时与其他证据同等对待，不得单独定罪。
    - **生物信号优先**：#6 唇形同步、#9 眨眼、#10 微表情三项全部正常时，若没有明确硬证据，必须判定"无伪造"。高质量换脸虽可模拟这些信号，但"疑罪从无"原则要求证据确凿才可翻案。
    - **预处理数据仅为量化参考**：面部比颈部/背景模糊（面颈比低）是美颜的正常表现，绝不能单独作为换脸证据。预处理数据异常≠伪造。
    - **置信度与证据量挂钩**：只有 0-1 条硬证据时，置信度不应超过 80；判定"无伪造"且各项正常时，置信度应给 90 以上。

