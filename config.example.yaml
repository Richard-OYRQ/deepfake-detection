# ============================================================\r
# 配置模板（无密钥版，可安全提交到 GitHub）\r
# 用法：复制为 config.yaml，填入你的 API key 后即可运行\r
# 原文件：config_v511.yaml（含明文密钥，已被 .gitignore 排除）\r
# ============================================================\r
# ============================================================
# DeepFake 视频批量处理 — 配置文件
# ============================================================

# --- API 设置 ---
api:
  base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"  # 千问 OpenAI 兼容接口
  api_key: "在这里填入你的密钥（DashScope 控制台申请）"
  model: "qwen3-vl-plus"                 # 模型名称（qwen-vl-max / qwen-vl-plus / qwen2.5-vl-72b-instruct）
  max_tokens: 8192
  temperature: 0.7
  timeout: 300                            # 单次请求超时（秒），视频处理可能需要较长时间
  enable_thinking: false                  # qwen3-vl-plus 思考模式（40视频实验：AUC仅0.53无增益，生产关闭省token）

# --- 并发 & 流控 ---
throttle:
  max_concurrent: 2          # 最大并发会话数
  requests_per_minute: 5     # 每分钟最大请求数（QPS 风控）
  retry_times: 3             # 失败重试次数
  vote_count: 2              # 两阶段策略：1票初筛 + 复检
  retry_backoff: 2.0         # 重试退避因子（指数退避：delay = backoff ** attempt）
  min_interval_seconds: 2.0  # 每次请求最小间隔（秒），避免短时间密集请求

# --- 判定策略 (v5.11 统一流程：对称投票 + 控方复检 + 三分类) ---
strategy:
  auto_mode: false                  # true=全自动判决（无人工复核）；false=三分类（含存疑人工复核）
  fake_recheck_conf_threshold: 90   # 初筛判"伪造"且置信度低于此值 → 进入复检（对抗辩护）
  final_fake_conf_threshold: 85     # 终裁为"伪造"所需的最低置信度，否则降为"存疑"
  final_real_conf_threshold: 90     # 终裁为"无伪造"所需的最低置信度，否则降为"存疑"
  suspicious_on_vote_split: true    # 复检票型分裂时输出"存疑"
  prior_high_threshold: 0.55        # CV 先验 P(伪造) 高于此值的"无伪造"初筛结果 → 控方对抗复核
  prior_conflict_threshold: 0.55    # 视觉判"无伪造"但先验高于此值 → 终裁"存疑"（视觉与量化特征冲突）
                                     # 基于200标注视频校准：0.55处漏检最少且真实误伤最低（4漏检/5-8真实转存疑）
  convict_prior: 0.70               # 融合定罪：复检轮任一拍子投伪造票 + CV先验≥此值 → 硬判"伪造"（40视频验证：检出35%/误报5%）
  attach_event_frames: true         # 送检层：附加事件证据图（遮挡交界放大/转动序列/帧差增强），供模型检查物理一致性
  prior_fusion: max                 # 双先验融合：max=新旧模型取高值（校准100%检出/14%误报@0.55）；mean=取均值；new=仅新模型
  phys_guard_threshold: 0.5         # 物理证据守卫（三分类，仅低清分支）：物理特征子分≥此值 → 至少"存疑"（校准：+2伪造捞回/+7真实进存疑）
  item_evidence_threshold: 3        # 控方证据子分定罪阈值（低清分支）：7个分离性单项的"异常"计数≥此值→伪造/存疑
                                    # 校准：CV漏检伪造24/26≥3，低先验真实2/10≥3（48样本）
  cv_visual_evidence: true          # v5.6：低清分支附加CV可视化证据图（纹理热力图+面颈剖面）+核验提示词块；
                                    # 核验"支持"→存疑（配对实验：敏感~45%/特异~93%，两轮复现）
  prior_anchor_table: true          # v5.7：实时先验锚定表值（官方实跑发现实时先验系统性上偏+0.2~0.3致24个误报）
  prior_convict_backstop: 0.55      # v5.8：消融实测0.55在校准集零误报且比0.70多捞21条伪造（84.mp4先验0.434，0.45即可挡住）
  # 控方轮整段替换提示词（B方案）：旧版激进提示词，对伪造敏感（91%检出），与新提示词互补。
  # 其误报倾向由 CV 先验阈值 + 存疑兜底约束。
  prosecutor_prompt: |
    你是一名顶级的数字取证与 DeepFake 检测专家。请逐帧仔细审查此视频，从以下维度系统性分析，判断视频中的人脸是否被 AI 换脸篡改。

    ## 检测维度
    请逐项检查，每项给出"正常 / 可疑 / 异常"判定，并注明具体时间戳和画面位置：

    ### 一、面部边缘与融合
    1. 面部边缘模糊/色块/锯齿 —— 面部轮廓与背景交界处是否存在过渡不自然的模糊、马赛克色块或锯齿状边缘？
    2. 面部拉伸/撕裂/运动脱节 —— 人物转头或快速移动时，面部是否出现拉伸变形、局部撕裂或与头部运动不同步？

    ### 二、皮肤与纹理
    3. 皮肤过度平滑/无毛孔/纹理重复 —— 面部皮肤是否像塑料一样过度平滑？是否存在周期性的纹理重复（AI 生成痕迹）？
    4. 肤色与背景冲突/帧间色差波动 —— 面部肤色是否与颈部、手部等裸露皮肤明显不同？逐帧之间面部色调是否稳定？

    ### 三、光影与色彩
    5. 光影方向与背景矛盾/阴影位置错误 —— 面部的亮面和阴影方向是否与背景环境光源一致？鼻影、下颌阴影位置是否合理？

    ### 四、唇部与语音
    6. 嘴部动作与语音不同步/唇形僵硬 —— 嘴唇开合是否与音频节奏匹配？唇形是否生硬、缺乏自然的过渡形态？

    ### 五、毛发与饰品
    7. 头发边缘毛边/断层/动态不匹配 —— 发丝边缘是否出现光晕、断裂或与头部运动不同步？
    8. 眉毛蜡笔画/睫毛重复/饰品错位 —— 眉毛纹理是否像画上去的？睫毛形态是否重复？眼镜等饰品是否变形或错位？

    ### 六、眼部与微表情
    9. 眼球呆滞/瞳孔反光异常/眨眼频率异常 —— 眼球转动是否自然？双眼瞳孔反光点位置是否一致？眨眼频率是否正常（成人平均 2-10 次/分钟）？
    10. 微表情缺失/肌肉运动僵硬 —— 说话时眉弓、颧肌、眼轮匝肌等是否有自然的微表情联动？还是整张脸僵硬如面具？

    ### 七、帧间时序
    11. 帧间面部特征突变/表情卡顿/闪烁 —— 逐帧播放时面部五官是否稳定？是否出现瞬移、卡顿或局部闪烁？

    ### 八、结构与比例
    12. 头身比异常/颈部色差/动态脱节 —— 头部与身体比例是否自然？颈部是否存在明显色差分界线或纹理缺失？头部转动时颈部是否跟随自然？
    13. 耳朵扭曲/颈部色差/颈部纹理缺失 —— 耳朵形状是否完整、对称？耳廓边缘是否扭曲？

    ### 九、背景
    14. 背景物体错位/动态粘连/背景模糊 —— 人物边缘的背景是否出现扭曲、物体错位、或随人物运动拖拽粘连？

    ## 输出格式
    请严格按以下格式输出：

    ### 逐项判定
    | # | 检测项 | 判定 | 时间戳 | 说明 |
    |---|--------|------|--------|------|
    | 1 | 面部边缘模糊/色块/锯齿 |   |   |   |
    | 2 | 面部拉伸/撕裂/运动脱节 |   |   |   |
    | 3 | 皮肤过度平滑/纹理重复 |   |   |   |
    | 4 | 肤色与背景冲突/帧间色差 |   |   |   |
    | 5 | 光影方向矛盾/阴影错误 |   |   |   |
    | 6 | 嘴部语音不同步/唇形僵硬 |   |   |   |
    | 7 | 头发毛边/断层/动态不匹配 |   |   |   |
    | 8 | 眉毛蜡笔画/睫毛重复/饰品错位 |   |   |   |
    | 9 | 眼球呆滞/反光异常/眨眼异常 |   |   |   |
    | 10 | 微表情缺失/肌肉僵硬 |   |   |   |
    | 11 | 帧间特征突变/卡顿/闪烁 |   |   |   |
    | 12 | 头身比异常/颈部色差/脱节 |   |   |   |
    | 13 | 耳朵扭曲/颈部纹理缺失 |   |   |   |
    | 14 | 背景错位/动态粘连/模糊 |   |   |   |

    ### 综合评估
    - 异常项统计：__ / 14
    - 伪造类型判断：（换脸 / 面部重演 / 全生成 / 无伪造）
    - 综合置信度：__ / 100
    - 关键证据（列出最有力的 3-5 条异常）：
      1.
      2.
      3.

    ### 最终结论
    （用 1-2 句话总结）

    ---
    ## ⚠️ 判定准则
    - **视觉为主，预处理为辅**：最终判定必须以视频画面中的视觉证据为主要依据。预处理清晰度数据提供量化参考，但不可取代视觉判断。预处理"全局柔化"仅表示面颈清晰度一致，不等于排除换脸。
    - **生物信号参考**：#6 唇形同步、#9 眨眼行为、#10 微表情是重要参考。但高质量换脸也可能在这些维度上表现自然——三个正常不等于无伪造。
    - **综合判断**：结合视觉检测、预处理数据、生物信号三方面综合权衡，不依赖任何单一来源。
  # 辩护人提示词：对初筛"伪造"结论进行对抗复核时，追加到原提示词末尾
  defender_suffix: |
    【辩护任务】上一轮检测将该视频判定为伪造。请你扮演辩方取证专家，独立复核：
    1. 逐条审查上轮引用的可疑/异常证据，判断每一项是否可以被美颜滤镜、磨皮、柔光、视频压缩、低码率、拍摄光照等因素完全解释；
    2. 检查上轮证据之间是否存在矛盾（如时间戳不一致、位置描述冲突）；
    3. 特别注意：面颈清晰度差异、皮肤平滑、边缘柔化这三类现象在美颜视频中极其常见，不构成伪造证据。
    请重新逐项检查并给出结论。如果你认为上轮判定证据不足，请勇敢推翻；如果你复核后确认证据链成立，请维持原判定。输出格式与之前完全一致。
  # 控方提示词：对"无伪造"但 CV 先验偏高的初筛结果进行对抗复核时，追加到原提示词末尾
  prosecutor_suffix: |
    【控方任务】上一轮检测将该视频判定为"无伪造"。请你扮演控方取证专家，独立复核：
    1. 假设该视频可能是高仿真换脸（现代换脸技术可以模拟自然的唇形同步、眨眼和微表情），重点寻找上一轮可能忽略的伪造证据；
    2. 重点检查：面部与颈部的肤色分界线、边界生硬断层、特定帧的五官结构突变或闪烁、光影方向矛盾、耳朵形态不对称、表情与肌肉联动脱节；
    3. 注意：预处理中"面部比颈部/背景模糊"在美颜视频中常见，不能单独作为证据——只有与其他视觉证据在时间/空间上耦合时才有意义。
    请重新逐项检查并给出结论。如果你确实找不到可靠的伪造证据链，请维持"无伪造"判定；如果发现明确证据，请勇敢翻案。输出格式与之前完全一致。

# --- 输出设置 ---
output:
  dir: "./output_v511"            # 输出根目录
  format: "both"             # 输出格式：json | markdown | both
  clean_dir: false           # 每次运行是否先清空输出目录

# --- 日志设置 ---
logging:
  level: "INFO"              # DEBUG / INFO / WARNING / ERROR
  file: "./logs/run_v511.log"     # 日志文件路径

# --- 视频任务 ---
videos:
  dir: "./_val100"            # 视频文件夹，自动扫描其中所有视频文件
  prompt: |                  # 默认提示词（所有视频共用）
    你是一名顶级的数字取证与 DeepFake 检测专家。请逐帧仔细审查此视频，从以下维度系统性分析，判断视频中的人脸是否被 AI 换脸篡改。

    ## ⚖️ 判定总原则：无罪推定
    你的默认先验是"该视频无伪造"。只有当画面中出现明确、可相互印证的伪造证据链时，才能翻案判定为伪造。**疑罪从无**：证据不足时，必须判"无伪造"或降低置信度，而不是凭印象判伪造。

    ## 重要前提：美颜滤镜不是伪造证据
    短视频平台的视频大量使用美颜、磨皮、柔光滤镜。它们与换脸在表面特征上高度相似，必须仔细辨析：

    | 特征 | 美颜滤镜（正常） | 换脸蒙版（伪造） |
    |------|-----------------|-----------------|
    | 空间分布 | 模糊均匀覆盖全脸，边界随面部结构自然渐变 | 边界生硬断层；面颈/面发/面耳交界处出现明显的色差割裂线 |
    | 时间稳定性 | 各帧表现一致，稳定无跳变 | 特定帧突变：瞬时模糊↔清晰跳变、局部闪烁、五官瞬移、色温骤变 |
    | 伴随现象 | 唇形同步、眨眼、微表情均自然 | 常伴随结构畸变、光影矛盾、表情肌肉脱节 |
    | 清晰度 | 美颜同样会造成"面部比颈部/背景模糊"——面颈清晰度失衡**不是**换脸专属特征 | 蒙版模糊常随时间波动、随遮挡变化，不稳定 |

    ## 检测维度
    请逐项检查，每项给出"正常 / 可疑 / 异常"判定，并注明具体时间戳和画面位置。"可疑"表示轻微异常但可由美颜/压缩/光照解释；"异常"表示明确不符合正常拍摄规律的现象。**单条"可疑"不构成伪造证据。**

    ### 一、面部边缘与融合
    1. 面部边缘模糊/色块/锯齿 —— 面部轮廓与背景交界处是否存在过渡不自然的模糊、马赛克色块或锯齿状边缘？注意：边缘轻微柔化是美颜常见表现，只有生硬的断层/锯齿/色块才算异常。
    2. 面部拉伸/撕裂/运动脱节 —— 人物转头或快速移动时，面部是否出现拉伸变形、局部撕裂或与头部运动不同步？

    ### 二、皮肤与纹理
    3. 皮肤过度平滑/无毛孔/纹理重复 —— 面部皮肤是否像塑料一样过度平滑？是否存在周期性的纹理重复？注意：磨皮美颜必然导致皮肤平滑，仅凭此项不能判伪造；周期性的纹理重复才是 AI 生成痕迹。
    4. 肤色与背景冲突/帧间色差波动 —— 面部肤色是否与颈部、手部明显不同？注意：美颜会单独调整面部色调，轻微色差属正常；只有面部与颈部之间出现**清晰的色差分界线**、或同一场景下帧间色温反复剧烈跳变才算异常。

    ### 三、光影与色彩
    5. 光影方向与背景矛盾/阴影位置错误 —— 面部的亮面和阴影方向是否与背景环境光源一致？鼻影、下颌阴影位置是否合理？

    ### 四、唇部与语音
    6. 嘴部动作与语音不同步/唇形僵硬 —— 嘴唇开合是否与音频节奏匹配？是否存在系统性的延迟或口型错误？

    ### 五、毛发与饰品
    7. 头发边缘毛边/断层/动态不匹配 —— 发丝边缘是否出现光晕、断裂或与头部运动不同步？注意：压缩和柔光也会让发丝边缘轻微糊化，只有明显的断裂/半透明融合才算异常。
    8. 眉毛蜡笔画/睫毛重复/饰品错位 —— 眉毛纹理是否像画上去的？睫毛形态是否重复？眼镜等饰品是否变形或错位？

    ### 六、眼部与微表情
    9. 眼球呆滞/瞳孔反光异常/眨眼频率异常 —— 眼球转动是否自然？双眼瞳孔反光点位置是否一致？眨眼频率是否正常（成人平均 2-10 次/分钟）？
    10. 微表情缺失/肌肉运动僵硬 —— 说话时眉弓、颧肌、眼轮匝肌等是否有自然的微表情联动？是否出现"嘴动脸不动"的分离感？

    ### 七、帧间时序
    11. 帧间面部特征突变/表情卡顿/闪烁 —— 逐帧播放时面部五官是否稳定？是否出现瞬移、卡顿或局部闪烁？注意：视频压缩在低码率帧上也会造成清晰度波动，只有五官结构瞬移/局部闪烁才算异常。

    ### 八、结构与比例
    12. 头身比异常/颈部色差/动态脱节 —— 颈部是否存在**明显的色差分界线**？注意：美颜通常只作用于面部，会造成面部比颈部模糊、色调略有差异，这属正常现象；明显的色差分界线或纹理断裂才是异常。
    13. 耳朵扭曲/颈部色差/颈部纹理缺失 —— 耳朵形状是否完整、对称？耳廓边缘是否扭曲？

    ### 九、背景
    14. 背景物体错位/动态粘连/背景模糊 —— 人物边缘的背景是否出现扭曲、物体错位、或随人物运动拖拽粘连？

    ### 十、物理一致性（无良性解释的硬证据）
    15. 遮挡破坏 —— 画面中的文字、字幕、话筒、手、眼镜框等物体遮挡人脸时，这些物体的边缘是否完整、锐利、连续地穿过人脸？与脸部交界处有无涂抹、断裂、笔画变形、边缘融化进脸部的现象？遮挡物是否在接触人脸时变模糊或时隐时现？注意：真实拍摄中遮挡物物理上位于人脸前方，其边缘必然完整保留；此类破坏是换脸重绘合成区域的典型特征，**美颜滤镜与视频压缩均无法解释**。
    16. 转动连续性 —— 头部从侧面转向正面（或大幅转动）的过程中，面部是否出现几何形变、五官跳动、脸型轮廓帧间抖动、或"身份闪回"（假脸与原脸交替出现）？转动前后同一五官的位置与形状是否连续？注意：真实转头是平滑的刚体+肌肉运动，五官相对位置连续无突变；美颜不改变几何结构，**转动中的形变与抖动无良性解释**。

